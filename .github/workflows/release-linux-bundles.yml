name: Release Linux Bundles

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-linux:
    name: Build, Sign & Release Linux (.deb, .rpm)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Release Changelog for Tag
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_CHANGELOG.md

      - name: Generate Full CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --output CHANGELOG.md

      - name: Commit and Push CHANGELOG.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --staged --quiet; then
            echo "CHANGELOG.md is already up-to-date."
          else
            git commit -m "chore(release): update CHANGELOG.md for ${{ github.ref_name }} [skip ci]"
            git push origin HEAD:main || echo "Push to main skipped or branch is protected."
          fi

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri Application (.deb, .rpm)
        run: pnpm tauri build --bundles deb,rpm

      - name: Collect Bundles and Sign with GPG
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # 1. Create staging directory for release files
          mkdir -p release-artifacts

          # 2. Collect .deb and .rpm packages from the build directory
          find target/release/bundle/ packages/app/src-tauri/target/release/bundle/ -type f \( -name "*.deb" -o -name "*.rpm" \) -exec cp {} release-artifacts/ \; 2>/dev/null || find . -path "*/target/release/bundle/*" -type f \( -name "*.deb" -o -name "*.rpm" \) -exec cp {} release-artifacts/ \;

          echo "Collected artifacts:"
          ls -la release-artifacts/

          # 3. Configure GPG agent and import Private Key
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          gpgconf --reload gpg-agent

          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

          # 4. Sign each package file (Detached Signature in .asc format)
          cd release-artifacts
          for file in *; do
            if [ -f "$file" ]; then
              echo "Signing $file with GPG..."
              gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --armor --detach-sign "$file"
            fi
          done

          # 5. Generate SHA256SUMS file for all artifacts
          echo "Generating SHA256SUMS..."
          sha256sum * > SHA256SUMS

          echo "Final release artifacts:"
          ls -la

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_CHANGELOG.md
          files: release-artifacts/*
          draft: false
          prerelease: false

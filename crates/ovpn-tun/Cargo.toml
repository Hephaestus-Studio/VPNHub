[package]
name = "ovpn-tun"
version = "0.1.2"
edition = "2021"
authors = ["VPNHub Team"]
description = "Cross-platform TUN device wrappers and Kernel DCO driver bindings for openvpn3-rs"

[dependencies]
bytes = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
ovpn-config = { path = "../ovpn-config" }
ovpn-crypto = { path = "../ovpn-crypto" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["net", "ioctl", "fs", "socket"] }

[target.'cfg(windows)'.dependencies]
wintun = "0.5"

[dev-dependencies]
tokio-test = "0.4"


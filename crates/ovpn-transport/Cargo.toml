[package]
name = "ovpn-transport"
version = "0.1.2"
edition = "2021"
authors = ["VPNHub Team"]
description = "Tokio-based UDP/TCP AsyncSockets, SOCKS5 & HTTP CONNECT proxies for openvpn3-rs"

[dependencies]
bytes = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
socket2 = { version = "0.5", features = ["all"] }
ovpn-protocol = { path = "../ovpn-protocol" }

[dev-dependencies]
tokio-test = "0.4"

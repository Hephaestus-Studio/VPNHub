[package]
name = "ovpn-config"
version = "0.1.0"
edition = "2021"
authors = ["VPNHub Team"]
description = "High-performance .ovpn configuration and dynamic PUSH_REPLY parser for openvpn3-rs"

[dependencies]
nom = "7.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
p12 = "0.6"
tracing = "0.1"
ipnet = { version = "2", features = ["serde"] }

[dev-dependencies]
tempfile = "3"

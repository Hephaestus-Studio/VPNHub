[package]
name = "ovpn-crypto"
version = "0.1.1"
edition = "2021"
authors = ["VPNHub Team"]
description = "Cryptographic primitives, AEAD, KDF, Post-Quantum ML-KEM-768, and anti-replay protection for openvpn3-rs"

[features]
default = []
pkcs11 = ["dep:cryptoki"]
os-keyring = ["dep:keyring"]

[dependencies]
aead = { version = "0.5", features = ["bytes"] }
aes-gcm = { version = "0.10", features = ["zeroize"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
x25519-dalek = { version = "2.0", features = ["static_secrets", "zeroize"] }
ml-kem = { version = "0.3", features = ["zeroize", "getrandom"] }
kem = "0.3"
zeroize = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
subtle = "2"
bytes = "1"
rand = "0.8"
rand_core = { version = "0.6", features = ["std"] }
cryptoki = { version = "0.12", optional = true }
keyring = { version = "4", optional = true }

[dev-dependencies]

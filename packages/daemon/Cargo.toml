[package]
name = "vpnhub-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
openvpn-connect = { version = "0.1.1", features = ["tokio", "vendor"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-service = "0.8.1"